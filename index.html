<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>军师 - 聊天交友指导顾问</title>
    <meta name="description" content="军师 - 你的微信聊天指导助手">
    <meta name="theme-color" content="#000000">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

    <!-- 样式 -->
    <link rel="stylesheet" href="css/style.css">

    <!-- 外部依赖 -->
    <script src="https://unpkg.com/@supabase/supabase-js@2?v=20260730"></script>
    <!-- FingerprintJS 已改为动态加载（避免 CDN ESM 报错问题） -->

    <!-- 配置文件（如存在则加载，否则回退到 example） -->
    <script src="config.js"></script>
    <script>
        // 如果 config.js 未加载或未配置，加载 example
        if (!window.APP_CONFIG) {
            document.write('<script src="config.example.js"><\/script>');
        }
    </script>
</head>
<body>
    <!-- Toast 提示 -->
    <div id="toast" class="toast"></div>

    <!-- 加载指示器 -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-spinner"></div>
    </div>

    <!-- ============================================================
         页面：登录/注册
         ============================================================ -->
    <div id="page-auth" class="page">
        <div class="auth-container">
            <div class="auth-logo">
                <div class="icon">🧠</div>
                <h1>军师</h1>
                <p>恋爱聊天指导助手</p>
            </div>

            <div class="auth-tabs">
                <div class="auth-tab active" data-form="login">登录</div>
                <div class="auth-tab" data-form="register">注册</div>
            </div>

            <!-- 登录 -->
            <div id="form-login" class="auth-form active">
                <input id="login-email" class="input" type="email" placeholder="邮箱地址" autocomplete="email" inputmode="email">
                <input id="login-password" class="input" type="password" placeholder="密码" autocomplete="current-password">
                <button id="login-btn" class="btn btn-primary btn-block">登录</button>
            </div>

            <!-- 注册 -->
            <div id="form-register" class="auth-form">
                <input id="register-email" class="input" type="email" placeholder="邮箱地址" autocomplete="email" inputmode="email">
                <input id="register-password" class="input" type="password" placeholder="密码（至少6位）" autocomplete="new-password">
                <input id="register-confirm" class="input" type="password" placeholder="确认密码" autocomplete="new-password">
                <button id="register-btn" class="btn btn-primary btn-block">注册</button>
            </div>

            <div class="auth-extra">
                注册即表示同意 <a href="#">服务条款</a> 和 <a href="#">隐私政策</a>
            </div>
        </div>
    </div>

    <!-- ============================================================
         页面：好友列表
         ============================================================ -->
    <div id="page-friends" class="page">
        <div class="friends-header">
            <div class="header-title">
                <h1>军师</h1>
                <span class="header-sub">你专属的恋爱顾问</span>
            </div>
            <div class="header-actions">
                <span id="header-status" class="status-badge">加载中...</span>
                <button id="bio-btn" class="icon-btn" title="我的简介">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
                </button>
                <button id="logout-btn" class="icon-btn" title="退出登录">
                    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
                </button>
            </div>
        </div>

        <div id="friends-list" class="friends-list">
            <div class="empty-state">
                <div class="empty-icon">💬</div>
                <p>加载中...</p>
            </div>
        </div>

        <button id="fab-add-friend" class="fab" title="新建好友">+</button>
    </div>

    <!-- ============================================================
         页面：聊天窗口
         ============================================================ -->
    <div id="page-chat" class="page">
        <div class="chat-header">
            <div id="chat-back" class="chat-back" title="返回">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </div>
            <div id="chat-title" class="chat-header-title">聊天</div>
        </div>

        <div id="chat-messages" class="chat-messages">
            <div class="empty-state" style="padding: 40px 20px;">
                <div class="empty-icon" style="font-size: 48px;">💬</div>
                <p style="font-size: 14px;">开始对话吧</p>
            </div>
        </div>

        <div class="chat-input-area">
            <button id="chat-paste-btn" class="chat-paste-btn" title="粘贴并发送">📋</button>
            <textarea id="chat-input" class="chat-input" rows="1" placeholder="粘贴对方的话，我来帮你回..." enterkeyhint="send"></textarea>
            <button id="chat-send-btn" class="chat-send-btn">发送</button>
        </div>
    </div>

    <!-- ============================================================
         弹窗：新建好友
         ============================================================ -->
    <div id="modal-new-friend" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title">新建好友</div>
            <div class="modal-body">
                <input id="new-friend-input" class="input" type="text" placeholder="输入好友昵称" maxlength="20">
            </div>
            <div class="modal-footer">
                <button id="new-friend-cancel" class="btn btn-outline">取消</button>
                <button id="new-friend-confirm" class="btn btn-primary">确定</button>
            </div>
        </div>
    </div>

    <!-- ============================================================
         弹窗：编辑好友（改名 / 备注）
         ============================================================ -->
    <div id="modal-edit-friend" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title">编辑好友</div>
            <div class="modal-body">
                <div class="field">
                    <span class="field-label">昵称</span>
                    <input id="edit-friend-name" class="input" type="text" placeholder="好友昵称" maxlength="20">
                </div>
                <div class="field">
                    <span class="field-label">备注（可选，用于标记年龄、住址、关系等）</span>
                    <input id="edit-friend-note" class="input" type="text" placeholder="例如：25岁/165/同事" maxlength="30">
                </div>
                <div class="field-hint">备注会直接显示在好友名字后面，方便快速识别</div>
            </div>
            <div class="modal-footer">
                <button id="edit-friend-cancel" class="btn btn-outline">取消</button>
                <button id="edit-friend-save" class="btn btn-primary">保存</button>
            </div>
        </div>
    </div>

    <!-- ============================================================
         长按好友 - 底部 Action Sheet（改名 / 备注 / 删除）
         ============================================================ -->
    <div id="action-sheet" class="action-sheet-overlay">
        <div class="action-sheet">
            <div class="action-sheet-header">
                <span class="sheet-name" id="sheet-friend-name">好友</span>
                长按操作
            </div>
            <button class="sheet-item" data-action="rename">
                <span class="sheet-icon">✎</span>
                <span>改名 / 备注</span>
            </button>
            <button class="sheet-item" data-action="delete">
                <span class="sheet-icon">🗑</span>
                <span>删除</span>
            </button>
            <button class="sheet-item sheet-cancel" data-action="cancel">
                <span class="sheet-icon">×</span>
                <span>取消</span>
            </button>
        </div>
    </div>

    <!-- ============================================================
         弹窗：我的简介（个性化内容，注入到会话生成上下文）
         组装顺序：统一提示词 > 我的简介 > 会话上下文 > 当前内容
         ============================================================ -->
    <div id="modal-bio" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title">我的简介</div>
            <div class="modal-body">
                <textarea id="bio-input" class="input" rows="6" maxlength="200"
                    placeholder="可填写个人简介，例如名字、年龄、爱好、经历等等，会在对话中自动引用"></textarea>
                <div class="bio-count" id="bio-count">0 / 200</div>
            </div>
            <div class="modal-footer">
                <button id="bio-cancel" class="btn btn-outline">取消</button>
                <button id="bio-save" class="btn btn-primary">保存</button>
            </div>
        </div>
    </div>

    <!-- ============================================================
         弹窗：付费墙
         ============================================================ -->
    <div id="paywall-overlay" class="paywall-overlay">
        <div class="paywall-card">
            <div class="paywall-icon">🧠</div>
            <div class="paywall-title">免费试用已结束</div>
            <div class="paywall-subtitle" id="paywall-tries-desc">50 次免费试用已用完</div>

            <div class="paywall-price" id="paywall-price">¥88<small>/月</small></div>
            <div class="paywall-desc">
                解锁无限次聊天指导<br>
                随时随地获得回复建议
            </div>

            <hr class="paywall-divider">

            <div class="paywall-activation">
                <input id="activation-input" class="input" type="text" placeholder="输入激活码" maxlength="20" autocomplete="off">
                <button id="activate-btn" class="btn btn-primary btn-block">激活会员</button>
                <a id="paywall-buy-link" class="paywall-buy-link" href="#">还没有激活码？去购买 →</a>
            </div>

            <button id="paywall-close-btn" class="paywall-close">稍后再说</button>
        </div>
    </div>

    <!-- ============================================================
         JavaScript 模块
         ============================================================ -->
    <script src="js/utils.js"></script>
    <script src="js/session.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/friends.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/paywall.js"></script>
    <script src="js/install-prompt.js"></script>
    <script src="js/app.js"></script>

    <!-- ============================================================
         诊断面板（排查"秒切回好友列表"问题）
         在网址后加 #debug 打开；日志存 localStorage（无敏感信息）
         ============================================================ -->
    <div id="debug-panel" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:#000;color:#7CFC9A;font:11px/1.5 monospace;padding:12px;overflow:auto;white-space:pre-wrap;">
        <div style="margin-bottom:8px;">
            <b style="font-size:14px;color:#fff;">🔍 诊断日志</b>
            <button onclick="document.getElementById('debug-log').textContent=(localStorage.getItem('junshi_debug_log')||'(empty)');" style="margin-left:8px;padding:3px 10px;background:#07C160;color:#fff;border:none;border-radius:4px;">刷新</button>
            <button onclick="localStorage.removeItem('junshi_debug_log');document.getElementById('debug-log').textContent='(cleared)';" style="margin-left:6px;padding:3px 10px;background:#333;color:#fff;border:none;border-radius:4px;">清空</button>
            <button onclick="document.getElementById('debug-panel').style.display='none';" style="margin-left:6px;padding:3px 10px;background:#666;color:#fff;border:none;border-radius:4px;">关闭</button>
        </div>
        <pre id="debug-log" style="margin:0;"></pre>
    </div>
    <script>
        // #debug 显示诊断面板
        (function () {
            function showDebug() {
                var panel = document.getElementById('debug-panel');
                if (!panel || location.hash !== '#debug') return;
                panel.style.display = 'block';
                document.getElementById('debug-log').textContent = localStorage.getItem('junshi_debug_log') || '(empty)';
            }
            window.addEventListener('hashchange', showDebug);
            if (location.hash === '#debug') showDebug();
        })();
    </script>
</body>
</html>
